# Enable append-only file persistence for durability
appendonly yes

# Set appendfsync policy to every second for performance and acceptable data safety
appendfsync everysec

# Save snapshot every 900s if at least 1 key changes
save 900 1

# Save snapshot every 300s if at least 10 keys change
save 300 10

# Save snapshot every 60s if at least 10000 keys change
save 60 10000

# Disable protected mode for external access (use firewall instead)
protected-mode no

# Bind to all network interfaces
bind 0.0.0.0

# Disable RDB compression for faster snapshot saving
rdbcompression no

# Set max memory to prevent OOM, adjust based on your machine
maxmemory 512mb

# Eviction policy for cache-like behavior
maxmemory-policy allkeys-lru

# Disable automatic replication backlog trimming
repl-backlog-size 10mb

# Enable client output buffering limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Enable TCP keepalive to maintain long connections
tcp-keepalive 300

# Rename dangerous commands for safety
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

requirepass yourStrongPassword123