# This node acts as a replica of the master
replicaof redis-master 6379

# Disable append-only file to reduce write load
appendonly no

# Disable RDB saving on replicas for read performance
save ""

# Disable protected mode for network access (secure via Docker network)
protected-mode no

# Bind to all interfaces
bind 0.0.0.0

# Disable persistence entirely on slave (read-only)
appendonly no

# Set read-only mode (default true)
replica-read-only yes

# Set backlog size for replication stream
repl-backlog-size 10mb

# Optimize TCP connections
tcp-keepalive 300

# Increase client buffer for high read concurrency
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit slave 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Rename dangerous commands for safety
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

requirepass yourStrongPassword123

# Authenticate to master using the same password
masterauth yourStrongPassword123