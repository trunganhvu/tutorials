# Redis configuration

# ========== BASIC ==========
bind 0.0.0.0
protected-mode yes
port 6379

# ========== SECURITY ==========
requirepass yourStrongPassword123

# ========== MEMORY MANAGEMENT ==========
maxmemory 512mb
# LRU eviction policy (cache-friendly)
maxmemory-policy allkeys-lru

# ========== PERSISTENCE ==========
# Save snapshot every 10 minutes if at least 1 key changed
save 600 1
dbfilename dump.rdb
dir /data
rdbcompression yes

# Append Only File (AOF) — better durability (optional)
appendonly yes
appendfsync everysec

# ========== LOG ==========
logfile /data/redis-server.log

# ========== PERFORMANCE ==========
tcp-keepalive 300
timeout 0

# ========== MODULES (optional) ==========
# loadmodule /path/to/module.so

# ========== NOTIFICATION ==========
notify-keyspace-events Ex
